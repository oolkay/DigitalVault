; Production HAL: pio run -e bluepill_hal -t upload
; Standalone diag:  pio run -e bluepill_diag -t upload

[platformio]
default_envs = bluepill_hal

[env]
platform = ststm32
board = bluepill_f103c8
framework = arduino
upload_protocol = custom
upload_command = st-flash --connect-under-reset write "$SOURCE" 0x08000000 && st-flash reset
monitor_speed = 115200
monitor_port = /dev/ttyUSB0
lib_deps =
    adafruit/Adafruit Fingerprint Sensor Library@^2.1.0
build_flags =
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC

[env:bluepill_hal]
build_src_filter =
    +<main.cpp>
    +<hal_codec.cpp>
    +<operation_fsm.cpp>
    +<sensor_service.cpp>

[env:bluepill_diag]
monitor_echo = yes
build_flags =
    ${env.build_flags}
    -D HAL_DIAG_BUILD
build_src_filter =
    +<diag_main.cpp>
    +<hal_codec.cpp>
    +<operation_fsm.cpp>
    +<sensor_service.cpp>

; Backward-compatible alias
[env:bluepill_f103c8]
extends = env:bluepill_hal
