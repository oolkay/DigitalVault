<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="347px" preserveAspectRatio="none" style="width:1908px;height:347px;background:#FFFFFF;" version="1.1" viewBox="0 0 1908 347" width="1908px" zoomAndPan="magnify"><title>Threat and Mitigation Overview</title><defs/><g><g class="title" data-source-line="1"><text fill="#000000" font-family="Arial" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="250.6602" x="821.6699" y="22.9951">Threat and Mitigation Overview</text></g><!--cluster Risks--><g class="cluster" data-qualified-name="Risks" data-source-line="7" id="ent0002"><path d="M215.5,43.2969 L258.0557,43.2969 A3.75,3.75 0 0 1 260.5557,45.7969 L267.5557,65.5938 L1720.5,65.5938 A2.5,2.5 0 0 1 1723,68.0938 L1723,127.7969 A2.5,2.5 0 0 1 1720.5,130.2969 L215.5,130.2969 A2.5,2.5 0 0 1 213,127.7969 L213,45.7969 A2.5,2.5 0 0 1 215.5,43.2969" fill="none" style="stroke:#000000;stroke-width:1.5;"/><line style="stroke:#000000;stroke-width:1.5;" x1="213" x2="267.5557" y1="65.5938" y2="65.5938"/><text fill="#000000" font-family="Arial" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="41.5557" x="217" y="58.292">Risks</text></g><!--cluster Mitigations--><g class="cluster" data-qualified-name="Mitigations" data-source-line="16" id="ent0009"><path d="M68.5,154.2969 L158.5996,154.2969 A3.75,3.75 0 0 1 161.0996,156.7969 L168.0996,176.5938 L1898.5,176.5938 A2.5,2.5 0 0 1 1901,179.0938 L1901,238.7969 A2.5,2.5 0 0 1 1898.5,241.2969 L68.5,241.2969 A2.5,2.5 0 0 1 66,238.7969 L66,156.7969 A2.5,2.5 0 0 1 68.5,154.2969" fill="none" style="stroke:#000000;stroke-width:1.5;"/><line style="stroke:#000000;stroke-width:1.5;" x1="66" x2="168.0996" y1="176.5938" y2="176.5938"/><text fill="#000000" font-family="Arial" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="89.0996" x="70" y="169.292">Mitigations</text></g><!--entity R1--><g class="entity" data-qualified-name="Risks.R1" data-source-line="8" id="ent0003"><rect fill="#F1F1F1" height="36.2969" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="223.1641" x="1484.5" y="78.2969"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="203.1641" x="1494.5" y="101.292">Lost or stolen storage device</text></g><!--entity R2--><g class="entity" data-qualified-name="Risks.R2" data-source-line="9" id="ent0004"><rect fill="#F1F1F1" height="36.2969" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="192.2861" x="1257" y="78.2969"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="172.2861" x="1267" y="101.292">Unauthorized fingerprint</text></g><!--entity R3--><g class="entity" data-qualified-name="Risks.R3" data-source-line="10" id="ent0005"><rect fill="#F1F1F1" height="36.2969" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="224.1279" x="998" y="78.2969"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="204.1279" x="1008" y="101.292">Biometric template exposure</text></g><!--entity R4--><g class="entity" data-qualified-name="Risks.R4" data-source-line="11" id="ent0006"><rect fill="#F1F1F1" height="36.2969" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="184.4043" x="779" y="78.2969"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="164.4043" x="789" y="101.292">Host-side key exposure</text></g><!--entity R5--><g class="entity" data-qualified-name="Risks.R5" data-source-line="12" id="ent0007"><rect fill="#F1F1F1" height="36.2969" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="260.5635" x="482.5" y="78.2969"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="240.5635" x="492.5" y="101.292">Vault left mounted unintentionally</text></g><!--entity R6--><g class="entity" data-qualified-name="Risks.R6" data-source-line="13" id="ent0008"><rect fill="#F1F1F1" height="36.2969" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="217.8252" x="229" y="78.2969"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="197.8252" x="239" y="101.292">Device removal while active</text></g><!--entity M1--><g class="entity" data-qualified-name="Mitigations.M1" data-source-line="17" id="ent0010"><rect fill="#F1F1F1" height="36.2969" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="228.7764" x="1655.5" y="189.2969"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="208.7764" x="1665.5" y="212.292">LUKS2 dm-crypt AES-256-XTS</text></g><!--entity M2--><g class="entity" data-qualified-name="Mitigations.M2" data-source-line="18" id="ent0011"><rect fill="#F1F1F1" height="36.2969" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="322.21" x="1298" y="189.2969"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="302.21" x="1308" y="212.292">Firmware-controlled fingerprint verification</text></g><!--entity M3--><g class="entity" data-qualified-name="Mitigations.M3" data-source-line="19" id="ent0012"><rect fill="#F1F1F1" height="36.2969" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="242.8857" x="1019.5" y="189.2969"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="222.8857" x="1029.5" y="212.292">Templates remain inside AS608</text></g><!--entity M4--><g class="entity" data-qualified-name="Mitigations.M4" data-source-line="20" id="ent0013"><rect fill="#F1F1F1" height="36.2969" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="285.8975" x="698" y="189.2969"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="265.8975" x="708" y="212.292">Short-lived key use and memory wipe</text></g><!--entity M5--><g class="entity" data-qualified-name="Mitigations.M5" data-source-line="21" id="ent0014"><rect fill="#F1F1F1" height="36.2969" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="232.7412" x="429.5" y="189.2969"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="212.7412" x="439.5" y="212.292">Auto-lock and emergency lock</text></g><!--entity M6--><g class="entity" data-qualified-name="Mitigations.M6" data-source-line="22" id="ent0015"><rect fill="#F1F1F1" height="36.2969" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="312.0449" x="82" y="189.2969"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="292.0449" x="92" y="212.292">Runtime reconciliation and cleanup paths</text></g><g class="entity" data-qualified-name="GMN22" data-source-line="33" id="ent0023"><path d="M6,285.2969 L6,340.6953 A0,0 0 0 0 6,340.6953 L470.3076,340.6953 A0,0 0 0 0 470.3076,340.6953 L470.3076,295.2969 L460.3076,285.2969 L242,285.2969 L238,225.3869 L234,285.2969 L6,285.2969 A0,0 0 0 0 6,285.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M460.3076,285.2969 L460.3076,295.2969 L470.3076,295.2969 L460.3076,285.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="428.7271" x="12" y="302.3638">The system protects data at rest and controls the unlock process.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="408.4844" x="12" y="317.4966">If the host is already compromised while the vault is unlocked,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="443.3076" x="12" y="332.6294">mounted files may still be accessible through the operating system.</text></g><!--link R1 to M1--><g class="link" data-entity-1="ent0003" data-entity-2="ent0010" data-link-type="dependency" data-source-line="25" id="lnk16"><path d="M1623.19,114.3269 C1655.78,134.7469 1704.9955,165.5713 1737.6355,186.0213" fill="none" id="R1-to-M1" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="1742.72,189.2069,1737.217,181.0388,1738.4829,186.5522,1732.9695,187.8181,1742.72,189.2069" style="stroke:#181818;stroke-width:1;"/></g><!--link R2 to M2--><g class="link" data-entity-1="ent0004" data-entity-2="ent0011" data-link-type="dependency" data-source-line="26" id="lnk17"><path d="M1369.56,114.3269 C1389.36,134.6869 1418.1166,164.2658 1438.0166,184.7258" fill="none" id="R2-to-M2" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="1442.2,189.0269,1438.7923,179.7863,1438.7139,185.4426,1433.0575,185.3641,1442.2,189.0269" style="stroke:#181818;stroke-width:1;"/></g><!--link R3 to M3--><g class="link" data-entity-1="ent0005" data-entity-2="ent0012" data-link-type="dependency" data-source-line="27" id="lnk18"><path d="M1114.84,114.3269 C1120.63,134.6869 1128.6284,162.7958 1134.4484,183.2558" fill="none" id="R3-to-M3" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="1136.09,189.0269,1137.4749,179.2759,1134.722,184.2177,1129.7802,181.4647,1136.09,189.0269" style="stroke:#181818;stroke-width:1;"/></g><!--link R4 to M4--><g class="link" data-entity-1="ent0006" data-entity-2="ent0013" data-link-type="dependency" data-source-line="28" id="lnk19"><path d="M866.31,114.3269 C860.71,134.6869 852.9845,162.7826 847.3445,183.2426" fill="none" id="R4-to-M4" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="845.75,189.0269,851.9979,181.4135,847.0787,184.2067,844.2856,179.2875,845.75,189.0269" style="stroke:#181818;stroke-width:1;"/></g><!--link R5 to M5--><g class="link" data-entity-1="ent0007" data-entity-2="ent0014" data-link-type="dependency" data-source-line="29" id="lnk20"><path d="M602.53,114.3269 C590.02,134.6869 572.3308,163.4546 559.7608,183.9146" fill="none" id="R5-to-M5" style="stroke:#181818;stro