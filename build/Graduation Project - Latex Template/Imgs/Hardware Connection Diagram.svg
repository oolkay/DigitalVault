265.1997,488.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="153.3848" x="25" y="505.3638">Runs GUI, serial bridge,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="235.1997" x="25" y="520.4966">vault controller, and vault manager.</text></g><!--link AS608 to STM32--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" data-source-line="12" id="lnk6"><path d="M380.96,80.4569 C365,88.3769 346.85,98.6369 332,110.2969 C313.87,124.5369 300.4049,140.004 289.3249,154.304" fill="none" id="AS608-to-STM32" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="285.65,159.0469,294.3243,154.3825,288.7124,155.0945,288.0004,149.4826,285.65,159.0469" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="151.8169" x="333" y="123.3638">UART TX RX, VCC, GND</text></g><!--link STM32 to PL2303--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" data-link-type="dependency" data-source-line="13" id="lnk7"><path d="M254.14,195.5169 C230.38,217.1969 194.2417,250.1821 170.4217,271.9221" fill="none" id="STM32-to-PL2303" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="165.99,275.9669,175.3341,272.8543,169.6831,272.5963,169.9411,266.9453,165.99,275.9669" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="116.5049" x="219" y="240.3638">UART TX RX, GND</text></g><!--link PL2303 to Host--><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" data-link-type="dependency" data-source-line="14" id="lnk8"><path d="M147,312.4569 C147,333.6969 147,363.6569 147,384.9769" fill="none" id="PL2303-to-Host" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="147,390.9769,151,381.97